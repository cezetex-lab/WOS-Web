name: Supabase Database Backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client 17 (PGDG)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          sudo update-alternatives --install /usr/bin/pg_dump pg_dump /usr/lib/postgresql/17/bin/pg_dump 170
          sudo update-alternatives --set pg_dump /usr/lib/postgresql/17/bin/pg_dump
          pg_dump --version

      - name: Create backup directory
        run: mkdir -p backups

      - name: Generate backup filename
        id: filename
        run: echo "filename=backup_$(date +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_OUTPUT

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -f "backups/${{ steps.filename.outputs.filename }}.sql"

      - name: Compress backup
        run: |
          cd backups
          gzip "${{ steps.filename.outputs.filename }}.sql"
          ls -lh

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.filename.outputs.filename }}
          path: backups/*.sql.gz
          retention-days: 30

      # Verifikasi artifact tepat di sini, bukan sebagai job terpisah di ci.yml
      # (hapus 2026-09-27). Alasannya:
      #   * Artifact antar-workflow-run tidak bisa dibaca tanpa API token, jadi
      #     job CIgdulu harus membuat dump sendiri — duplikasi kerja.
      #   * Job itu masih memakai pg_dump 16 (PGDG terpasang tapi /usr/bin/pg_dump
      #     tidak diarahkan ke v17) → "server version mismatch" di CI.
      # Di sini dump-nya sudah jadi, jadi tidak ada pg_dump kedua dan tidak ada
      # mismatch. Script ini zero-dependency (hanya node:fs + node:zlib), jadi
      # tidak perlu `npm ci` maupun `actions/setup-node` — Node 20+ sudah ada
      # di ubuntu-24.04.
      #
      # Memeriksa file yang BARU dibuat di run ini, bukan artifact lama — jadi
      # damage baru ketahuki di run yang sama, bukan 24 jam kemudian.
      - name: Verify artifact
        run: node scripts/verify-backup-artifact.mjs "backups/${{ steps.filename.outputs.filename }}.sql.gz"
