# =============================================================================
# CI — Batch Fix #1 (P1-18-01: tidak ada CI untuk gate kode)
# =============================================================================
# KENAPA workflow ini ada
#   .github/workflows/ hanya berisi `supabase-backup.yml`. Tidak ada workflow
#   yang menjalankan `check:types` / `lint` / `test` / `build`. Semua gate
#   dijalankan manual oleh agen lokal — dan itulah penyebab guard
#   `doc-claims-vs-live` menangkap drift tanpa ada yang menjalankan
#   (P1-56-01: unit suite diam-diam merah).
#
#   Workflow ini adalah PRASARAT untuk Batch Fix #2 (sinkronisasi artefak),
#   #3 (test keamanan nyata), dan #10 (dokumentasi) — semuanya menghasilkan
#   guard yang hanya berguna kalau guard itu jalan OTOMATIS.
#
# CATATAN TENTANG SECRETS
#   TIDAK ADA secret Supabase yang di-hardcode di file ini. Build memakai
#   `import.meta.env.VITE_*` yang nilainya disisipkan Vite saat bundling dan
#   hanya dipakai saat RUNTIME di browser (createClient tidak dieksekusi saat
#   `vite build`), sehingga `npm run build` VERIFIED berjalan tanpa env.
#   Step `Verify derived artifacts` (Batch Fix #2) memakai
#   `${{ secrets.SUPABASE_DB_URL }}` — nilainya TIDAK pernah ditulis literal
#   di YAML, hanya SELECT read-only lewat `pg`.
#
# RESIDUAL:
#   - [SELESAI Batch #2] `test` tidak lagi memakai `continue-on-error`;
#     P1-56-01 ditutup dan step `Verify derived artifacts` ditambahkan.
#   - Branch protection `migrasi-vite` — ruleset "protect-migrasi-vite"
#     AKTIF per 2026-09-26 (push ditolak bila CI merah; force push diblokir).
# =============================================================================
name: CI

on:
  push:
    branches: [migrasi-vite]
  pull_request:
    branches: [migrasi-vite]

# Batalkan run sebelumnya untuk branch yang sama — hemat kuota runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: types / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # CATATAN: repo tidak mendeklarasikan versi Node (tidak ada .nvmrc /
          # .node-version / engines / packageManager). Dipakai Node 22 LTS karena
          # Vite 8 mensyaratkan >= 22.12 dan TypeScript 7 + Vitest 4 butuh >= 20.
          # Dev lokal berjalan di v24.19.0 — jika CI menunjukkan perbedaan
          # perilaku, tambahkan `engines.node` ke package.json (di luar scope #1).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run lint

      # Batch Fix #2 (P1-71-01 Akar A, P1-56-01, P1-31-01): angka di
      # ARCHITECTURE.md §7.3/§7.4 meluruh tiap ada migrasi. Guard ini
      # membandingkan dokumen vs DB live vs isi repo. Dijalankan SEBELUM test
      # supaya drift ketahuan di sumbernya, bukan lewat test yang gagal.
      #
      # `pg` hanya menjalankan SELECT — tidak menulis ke live.
      - name: Verify derived artifacts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run verify:artifacts

      - name: Unit test
        # `continue-on-error` DIHAPUS (Batch Fix #2): P1-56-01 sudah tertutup —
        # ARCHITECTURE.md §7.3/§7.4 sinkron dengan live. Kegagalan unit test
        # sekarang memblokir, dan tidak ada test yang dihapus.
        run: npm run test

      - name: Build
        run: npm run build
