<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Favicon: tidak ada favicon.ico di public/ — pakai PNG 192 agar browser
         tidak me-request /favicon.ico (jatuh ke SPA rewrite → index.html) -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#38bdf8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="insightWOS" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="description" content="Platform Workforce Intelligence untuk manajemen SDM yang lebih cerdas" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="insightWOS" />

    <!-- SEO -->
    <meta property="og:title" content="insightWOS — Workforce Intelligence" />
    <meta property="og:description" content="Platform Workforce Intelligence untuk manajemen SDM yang lebih cerdas" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://insightwos.vercel.app" />

    <title>insightWOS — Workforce Intelligence</title>
    <!-- Suppress harmless Vite internal warnings.
         JANGAN tambah pola suppress baru di sini — menyembunyikan bug asli. -->
    <script>
      window.addEventListener('error', function(e) {
        // Suppress web-vitals startTime TypeError (browser API issue)
        if (e.message && e.message.includes('startTime')) { e.preventDefault(); return true; }
        // Suppress rolldown preload unused warnings
        if (e.message && e.message.includes('preloaded using link preload')) { e.preventDefault(); return true; }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px;">
        <div>
          <p style="font-size:18px;font-weight:600;margin-bottom:8px;">insightWOS membutuhkan JavaScript</p>
          <p style="font-size:14px;color:#94a3b8;">Aktifkan JavaScript di browser Anda lalu muat ulang halaman ini.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('SW registered:', reg.scope),
            (err) => console.log('SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
